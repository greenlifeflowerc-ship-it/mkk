name: mkc
description: "IRON OMEN - 2D arcade fighting game (Flutter + Flame)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.37.0
  flame_audio: ^2.12.1
  shared_preferences: ^2.5.5
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.9.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/fighters/ash_viper/
    - assets/images/fighters/iron_ghost/
    - assets/images/fighters/night_blade/
    - assets/images/fighters/grave_warden/
    - assets/images/stages/haunted_cemetery/
    - assets/images/stages/dusk_peaks/
    - assets/images/fx/
    - assets/images/ui/
